# Continuous integration of the local_mooc_audit plugin (plugin/local_mooc_audit) with moodlehq/moodle-plugin-ci.
# The checks run on the installable ZIP built by tools/package-plugin.sh (the same package an administrator installs),
# which is kept as a workflow artifact.
# Same platform as the laboratory (moodle-env/README.md): Moodle 4.5, PHP 8.3, PostgreSQL. The third-party plugins
# used by the test fixtures (certificate, game, completion progress block) are installed from their public repositories.
name: Moodle Plugin CI

on:
  push:
    paths:
      - 'plugin/local_mooc_audit/**'
      - 'tools/package-plugin.sh'
      - '.github/workflows/moodle-plugin-ci.yml'
  pull_request:
    paths:
      - 'plugin/local_mooc_audit/**'
      - 'tools/package-plugin.sh'
      - '.github/workflows/moodle-plugin-ci.yml'

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Build the installable ZIP
        run: |
          cd repo
          tools/package-plugin.sh HEAD ../dist
          cd ..
          mkdir pkg && unzip -q dist/local_mooc_audit-*.zip -d pkg

      - name: Keep the ZIP as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_mooc_audit-zip
          path: dist/
          if-no-files-found: error

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install the plugin, its test dependencies and Moodle
        run: |
          moodle-plugin-ci add-plugin --branch master davidherney/moodle-mod_simplecertificate
          # mod_game keeps its current code (2026100800, as in the lab) on its default branch MOODLE_20_STABLE;
          # its master branch only has a README.
          moodle-plugin-ci add-plugin --branch MOODLE_20_STABLE bdaloukas/moodle-mod_game
          moodle-plugin-ci add-plugin --branch master deraadt/moodle-block_completion_progress
          moodle-plugin-ci install --plugin ./pkg/mooc_audit --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
